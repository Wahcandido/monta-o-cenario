<!doctype html><html lang="pt-PT"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Monta o Cenário</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700;800&display=swap">
<style>
/* Layout: menu com personagem, nível e grelha de cenários; jogo com palco do cenário em cima e cartão de letras em baixo (lado a lado em ecrãs largos) */
:root{
  color-scheme:light;
  --sky:#eaf4fb; --sky2:#d9ebf7; --paper:#ffffff; --ink:#173a63; --muted:#56708c; --line:#cfe1ef;
  --blue:#1e6fb8; --orange:#f28c13; --green:#5f9e2f; --yellow:#f6c12d; --navy:#183f73; --ok:#2e9a52; --no:#d6434a;
  --pink:#e0569a; --pink-d:#a8336c; --pink-soft:#fff4f9; --pink-line:#f7c3dc;
  --wood:#ffe9b8; --wood-edge:#e0b25a; --wood-ink:#6b4310;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--sky);color:var(--ink)}
body{font-family:var(--body);font-size:16px;margin:0;
  background-image:radial-gradient(circle at 8% 4%,var(--sky2) 0 110px,transparent 111px),radial-gradient(circle at 96% 30%,var(--sky2) 0 90px,transparent 91px)}
.wrap{max-width:1040px;margin:0 auto;padding-block:12px 36px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:54px;height:54px;border-radius:50%;background:#fff;border:3px solid #fff;box-shadow:0 2px 0 var(--line);flex:none}
.brand b{font-family:var(--display);font-weight:800;font-size:1.45rem;line-height:1;display:block}
.brand b span:nth-child(1){color:var(--blue)} .brand b span:nth-child(2){color:var(--orange)} .brand b span:nth-child(3){color:var(--green)}
.brand small{font-weight:800;color:var(--navy);font-size:.75rem;letter-spacing:.06em}
.brand .grow{flex:1;min-width:0}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,6vw,2.3rem);line-height:1.02;margin:0;text-wrap:balance}
h1 em{font-style:normal;color:var(--pink)}
h3{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.btn{font:800 .95rem var(--body);border:2px solid var(--ink);background:var(--paper);color:var(--ink);
  border-radius:14px;padding:10px 14px;cursor:pointer;box-shadow:0 3px 0 var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.pink{background:var(--pink);border-color:var(--pink-d);box-shadow:0 3px 0 var(--pink-d);color:#fff}
button:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.panel{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:14px;position:relative}
/* menu */
.pick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pickb{border:2px solid var(--line);background:#fff;border-radius:18px;padding:8px 6px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font:800 .95rem var(--body);color:var(--ink)}
.pickb small{font-weight:700;color:var(--muted);font-size:.76rem;text-align:center;line-height:1.2}
.pickb[aria-pressed="true"]{border-color:var(--pink);background:var(--pink-soft);box-shadow:0 3px 0 var(--pink-line)}
.pickb .av{width:100%;height:120px;border-radius:14px;background:var(--sky);overflow:hidden;display:flex;justify-content:center;padding-top:6px}
.pickb .av svg{height:100%;width:auto}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lvb{border:2px solid var(--line);background:#fff;border-radius:16px;padding:10px;cursor:pointer;text-align:left;font:800 1rem var(--body);color:var(--ink)}
.lvb small{display:block;font-weight:700;color:var(--muted);font-size:.78rem;line-height:1.25;margin-top:2px}
.lvb .dots{display:flex;gap:3px;margin-bottom:4px}.lvb .dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.lvb[aria-pressed="true"]{border-color:var(--pink);background:var(--pink-soft)}
.lvb[aria-pressed="true"] .dots i.on{background:var(--pink)}
.setup{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:820px){.setup{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font:800 .9rem var(--body);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.scard{border:2px solid var(--line);background:#fff;border-radius:18px;padding:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;color:var(--ink);font:inherit;box-shadow:0 3px 0 var(--line);position:relative}
.scard:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.scard .ic{width:100%;height:76px;border-radius:12px;display:flex;align-items:flex-end;justify-content:center;gap:2px;padding:6px 4px 4px;overflow:hidden}
.scard .ic svg{width:44px;height:44px;flex:none}
.scard .ic svg.big{width:56px;height:56px}
.scard b{font-family:var(--display);font-size:1.02rem;line-height:1.1}
.scard .st{display:flex;gap:2px;font-size:.95rem;color:var(--line);letter-spacing:.02em}
.scard .st i{font-style:normal}.scard .st i.on{color:var(--yellow)}
.scard.new::after{content:"NOVO";position:absolute;top:8px;right:8px;background:var(--pink);color:#fff;font-size:.62rem;font-weight:800;border-radius:6px;padding:2px 6px;letter-spacing:.05em}
.prog{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--muted);font-size:.9rem}
.prog .bar{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--yellow)}
/* jogo */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{flex:1;min-width:0}
.game{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:880px){.game{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}}
.stage{padding:8px;overflow:hidden}
.scene{display:block;width:100%;height:auto;border-radius:16px}
.scene .pop{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.1) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
.scene .ghost{opacity:.18}
.scene .char.bounce{animation:hop .6s}
@keyframes hop{0%,100%{transform:none}35%{transform:translateY(-14px)}65%{transform:translateY(0)}80%{transform:translateY(-5px)}}
.scene .char{transform-box:fill-box;transform-origin:bottom center}
.strip{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}
.sl{aspect-ratio:1;border-radius:14px;background:var(--sky);border:2px dashed var(--line);display:grid;place-items:center;padding:7px}
.sl svg{width:100%;height:100%;filter:grayscale(1) opacity(.3)}
.sl.done{background:#fff;border:2px solid var(--pink-line)} .sl.done svg{filter:none}
.sl.now{border:2px solid var(--pink);background:var(--pink-soft)} .sl.now svg{filter:grayscale(.15) opacity(.9)}
.count{position:absolute;top:16px;left:16px;font-weight:800;color:var(--ink);font-size:.88rem;background:rgba(255,255,255,.92);border-radius:999px;padding:4px 10px;z-index:2}
canvas.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.card{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.tag{display:flex;align-items:center;gap:12px;background:var(--pink-soft);border:2px solid var(--pink-line);border-radius:20px;padding:10px 12px;width:100%}
.tag .pv{width:88px;height:88px;flex:none;display:grid;place-items:center}
.tag .pv svg{width:100%;height:100%}
.tag .q{flex:1;text-align:left;min-width:0}
.tag .q b{display:block;font-family:var(--display);font-size:1.25rem;line-height:1.1}
.tag .q span{color:var(--muted);font-weight:700;font-size:.9rem}
.hear{border:none;background:var(--pink);color:#fff;width:52px;height:52px;border-radius:50%;font-size:1.35rem;cursor:pointer;box-shadow:0 3px 0 var(--pink-d);flex:none}
.slots{display:grid;gap:6px;justify-content:center;width:100%}
.slot{aspect-ratio:1/1.1;border:none;border-bottom:5px solid var(--ink);background:transparent;cursor:pointer;
  font-family:var(--display);font-weight:800;color:var(--ink);padding:0;line-height:1;min-width:0}
.slot.fixed{color:var(--pink);border-color:var(--pink);cursor:default}
.slots.ok .slot{color:var(--ok);border-color:var(--ok)}
.slots.bad{animation:shake .35s}
.slots.bad .slot{border-color:var(--no)}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-3px)}}
.tiles{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;min-height:62px}
.tile{width:52px;height:58px;border-radius:14px;background:var(--wood);border:3px solid var(--wood-edge);box-shadow:0 4px 0 var(--wood-edge);
  font-family:var(--display);font-weight:800;font-size:1.9rem;color:var(--wood-ink);cursor:pointer;display:grid;place-items:center;padding:0;transition:transform .15s,opacity .15s}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wood-edge)}
.tile.first{background:#ffd6ea;border-color:var(--pink);box-shadow:0 4px 0 var(--pink);color:#8a1f55}
.tile.used{opacity:0;pointer-events:none;transform:scale(.4)}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.hint{color:var(--muted);font-weight:700;margin:0;min-height:1.3em;font-size:.95rem}
.win{display:flex;flex-direction:column;align-items:center;gap:10px}
.win h2{font-family:var(--display);font-size:1.7rem;margin:0;line-height:1.1}
.win p{margin:0;font-weight:700;color:var(--muted)}
.stars{font-size:2.3rem;color:var(--yellow);letter-spacing:.1em}
.words{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.words span{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px;font-weight:800}
.words svg{width:24px;height:24px}
.credit{text-align:center;color:var(--muted);font-size:.84rem;margin:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

try{const d=JSON.parse(localStorage.getItem("corujitas-cenas-v1")||"null");if(d)P={...P,...d}}catch(e){}
if(!CHARS[P.char])P.char="lia";
const save=()=>{try{localStorage.setItem("corujitas-cenas-v1",JSON.stringify(P))}catch(e){}};
const starsOf=id=>LEVELS.map(l=>!!(P.done[id]&&P.done[id][l.k]));

/* ---------- menu ---------- */
function home(){
  $("back").hidden=true;window.scrollTo(0,0);
  const totalStars=ALL.reduce((a,s)=>a+starsOf(s.id).filter(Boolean).length,0),max=ALL.length*3;
  const list=ALL.filter(s=>P.cat==="Todos"||s.cat===P.cat);
  $("view").innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">
    <h1>Monta o <em>cenário</em></h1>
    <div class="setup">
      <div class="panel"><h3>Personagem</h3><div class="pick">${Object.entries(CHARS).map(([k,c])=>`<button class="pickb" data-c="${k}" aria-pressed="${P.char===k}"><span class="av">${avatar(k)}</span>${c.name}<small>${c.sub}</small></button>`).join("")}</div></div>
      <div class="panel"><h3>Nível</h3><div class="lv">${LEVELS.map((l,i)=>`<button class="lvb" data-l="${l.k}" aria-pressed="${P.level===l.k}"><span class="dots">${[0,1,2].map(j=>`<i class="${j<=i?"on":""}"></i>`).join("")}</span>${l.n}<small>${l.d}</small></button>`).join("")}</div>
        <div class="prog" style="margin-top:12px"><span>★ ${totalStars} / ${max}</span><span class="bar"><i style="width:${totalStars/max*100}%"></i></span></div></div>
    </div>
    <div class="chips">${CATS.map(c=>`<button class="chip" data-cat="${c}" aria-pressed="${P.cat===c}">${c}</button>`).join("")}</div>
    <div class="grid">${list.map(s=>{const st=starsOf(s.id);const bgc=s.pal[0];
      return `<button class="scard ${s.dress?"new":""}" data-s="${s.id}"><span class="ic" style="background:linear-gradient(180deg,${bgc} 0 62%,${s.pal[1]} 62%)">${
        s.dress?`<span style="width:60px;height:72px">${`<svg viewBox="40 30 220 470" style="width:100%;height:100%">${personBody(CHARS.lia,new Set(DRESS.map(d=>d.k)))}</svg>`}</span>`
        :s.items.slice(0,3).map((it,j)=>icon(it.i,undefined,undefined,undefined,j===1?"big":"")).join("")}</span><b>${s.name}</b><span class="st">${st.map(v=>`<i class="${v?"on":""}">★</i>`).join("")}</span></button>`}).join("")}</div>
    <p class="credit">Criado pela professora <b>Allyne Maciel Ferreira</b> · Corujitas, Ninho do Saber</p></div>`;
  document.querySelectorAll(".pickb").forEach(b=>b.onclick=()=>{P.char=b.dataset.c;save();home()});
  document.querySelectorAll(".lvb").forEach(b=>b.onclick=()=>{P.level=b.dataset.l;save();home()});
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{P.cat=b.dataset.cat;save();home()});
  document.querySelectorAll(".scard").forEach(b=>b.onclick=()=>play(b.dataset.s));
}

/* ---------- jogo ---------- */
let G=null;
function play(id){
  const sc=ALL.find(s=>s.id===id);if(!sc)return home();
  G={sc,idx:0,placed:new Set(),pop:null,pos:layout(sc.items),round:null};
  try{history.replaceState(null,"","#"+id)}catch(e){}
  $("back").hidden=false;window.scrollTo(0,0);newRound();render();
  say(sc.dress?"Vamos vestir a Lia":(sc.name));
}
function newRound(){
  const it=G.sc.items[G.idx],L=[...it.w],n=L.length,lv=P.level;
  let fixed=Array(n).fill(false);
  if(lv==="facil"){const miss=Math.max(1,Math.ceil(n/3));const pos=shuffle([...Array(n).keys()].slice(1)).slice(0,miss);fixed=fixed.map((_,i)=>!pos.includes(i))}
  const free=[...Array(n).keys()].filter(i=>!fixed[i]);
  let tiles=free.map(i=>({ch:L[i],first:i===0&&lv==="medio",used:false}));
  if(lv==="dificil"){const AB="ABCDEFGILMNOPRSTUV".split("").filter(c=>!L.includes(c));shuffle(AB).slice(0,2).forEach(c=>tiles.push({ch:c,first:false,used:false}))}
  let t2;do{t2=shuffle(tiles)}while(tiles.length>1&&t2.map(t=>t.ch).join("")===tiles.map(t=>t.ch).join(""));
  G.round={it,L,fixed,slots:L.map((c,i)=>fixed[i]?c:null),src:Array(n).fill(null),tiles:t2,state:"",done:false,hints:0};
}
function place(t){const r=G.round;const k=r.slots.findIndex(v=>v===null);if(k<0)return;r.slots[k]=r.tiles[t].ch;r.src[k]=t;r.tiles[t].used=true;check();renderCard()}
function unplace(k){const r=G.round;if(r.fixed[k]||r.slots[k]===null||r.done)return;r.tiles[r.src[k]].used=false;r.slots[k]=null;r.src[k]=null;r.state="";renderCard()}
function clearFree(r){r.slots.forEach((v,i)=>{if(!r.fixed[i]&&v!==null){r.tiles[r.src[i]].used=false;r.slots[i]=null;r.src[i]=null}})}
function hintMax(n){return n<=4?1:n<=7?2:3}
function hintsLeft(){const r=G.round;const free=r.L.filter((c,i)=>!r.fixed[i]).length;return Math.max(0,Math.min(hintMax(r.L.length)-r.hints,free-1))}
function hint(){const r=G.round;if(r.done||hintsLeft()<=0)return;
  let k;if(!r.fixed[0])k=0;else{const cand=r.L.map((c,i)=>i).filter(i=>!r.fixed[i]);k=cand[Math.random()*cand.length|0]}
  clearFree(r);const t=r.tiles.findIndex(x=>!x.used&&x.ch===r.L[k]);r.slots[k]=r.L[k];r.src[k]=t;r.tiles[t].used=true;r.fixed[k]=true;r.hints++;r.state="";check();renderCard()}
function check(){const r=G.round;if(r.slots.includes(null))return;
  if(r.slots.join("")===r.it.w){r.state="ok";r.done=true;G.placed.add(G.idx);G.pop=G.idx;say(r.it.w);renderStage();setTimeout(()=>burst(.5,.5,40),150)}
  else{r.state="bad";setTimeout(()=>{if(G&&G.round===r&&r.state==="bad"){clearFree(r);r.state="";renderCard()}},750)}}
function next(){G.idx++;G.pop=null;if(G.idx<G.sc.items.length){newRound();render()}else finish()}
function finish(){
  const id=G.sc.id;P.done[id]=P.done[id]||{};const first=!P.done[id][P.level];P.done[id][P.level]=1;save();
  render();setTimeout(()=>burst(.5,.35,170),200);
  const ch=CHARS.lia;say(G.sc.dress?"A Lia está pronta!":"Cenário completo!");
}
function renderStage(){
  const sc=G.sc,ckey=sc.dress?"lia":P.char;
  const worn=sc.dress?new Set([...G.placed].map(i=>sc.items[i].k)):null,popK=sc.dress&&G.pop!==null?sc.items[G.pop].k:null;
  let items="";if(!sc.dress)sc.items.forEach((it,i)=>{const [x,y,s]=G.pos[i];
    if(G.placed.has(i))items+=`<g class="${G.pop===i?"pop":""}">${icon(it.i,x,y,s)}</g>`;
    else if(i===G.idx)items+=`<g class="ghost">${icon(it.i,x,y,s)}</g>`});
  const ch=sc.dress?charSVG("lia",400,40,440,worn,popK):charSVG(ckey,400,168,300);
  $("stageSvg").innerHTML=`<svg class="scene" viewBox="0 0 800 500" role="img" aria-label="${esc(sc.name)}">${bgSVG(sc.bg,sc.pal)}${ch}${items}</svg>`;
  if(G.pop!==null){const c=document.querySelector("#char");if(c){c.classList.add("bounce")}}
  $("count").textContent=`${G.placed.size} / ${sc.items.length}`;
  $("strip").innerHTML=sc.items.map((it,i)=>`<div class="sl ${G.placed.has(i)?"done":""} ${i===G.idx&&!G.placed.has(i)?"now":""}">${sc.dress?dressPv(DRESS.find(d=>d.k===it.k)):icon(it.i)}</div>`).join("");
}
function render(){
  const sc=G.sc;
  $("view").innerHTML=`<div style="display:flex;flex-direction:column;gap:12px">
    <div class="top"><h1>${esc(sc.name)}</h1><span class="chip" style="cursor:default">${LEVELS.find(l=>l.k===P.level).n}</span></div>
    <div class="game"><section class="panel stage"><span class="count" id="count"></span><div id="stageSvg"></div><div class="strip" id="strip"></div><canvas class="fx" id="fx"></canvas></section>
    <section class="panel" id="card"></section></div></div>`;
  renderStage();renderCard();
}
function renderCard(){
  const sc=G.sc,c=$("card");
  if(G.idx>=sc.items.length){
    const i=ALL.findIndex(s=>s.id===sc.id),nx=ALL[(i+1)%ALL.length];
    c.innerHTML=`<div class="win"><div class="stars">${"★".repeat(LEVELS.findIndex(l=>l.k===P.level)+1)}</div><h2>${sc.dress?"A Lia está pronta!":"Cenário completo!"}</h2>
      <p>Escreveste ${sc.items.length} palavras no nível ${LEVELS.find(l=>l.k===P.level).n}.</p>
      <div class="words">${sc.items.map(it=>`<span>${sc.dress?dressPv(DRESS.find(d=>d.k===it.k)):icon(it.i)}${it.w}</span>`).join("")}</div>
      <div class="actions"><button class="btn pink" id="nx">Próximo: ${esc(nx.name)} →</button><button class="btn" id="again">Jogar outra vez</button><button class="btn" id="menu">Todos os cenários</button></div></div>`;
    $("nx").onclick=()=>play(nx.id);$("again").onclick=()=>play(sc.id);$("menu").onclick=()=>{try{history.replaceState(null,"",location.pathname)}catch(e){}home()};return;
  }
  const r=G.round,it=r.it,n=r.L.length,fs=n>9?"1.35rem":n>7?"1.65rem":"2.1rem";
  const pv=sc.dress?dressPv(DRESS.find(d=>d.k===it.k)):icon(it.i);
  c.innerHTML=`<div class="card">
    <div class="tag"><span class="pv">${pv}</span><span class="q"><b>${r.done?`Boa! ${it.w}`:"O que é isto?"}</b><span>${r.done?"Muito bem, já está no cenário.":"Forma a palavra com as letras."}</span></span><button class="hear" id="hear" aria-label="Ouvir a palavra">🔊</button></div>
    <div class="slots ${r.state}" style="grid-template-columns:repeat(${n},minmax(0,52px))">${r.slots.map((v,k)=>`<button class="slot ${r.fixed[k]?"fixed":""}" data-s="${k}" style="font-size:${fs}" aria-label="espaço ${k+1}">${v??""}</button>`).join("")}</div>
    ${r.done?`<button class="btn pink" id="next" style="font-size:1.1rem">${G.idx+1<sc.items.length?"Próxima palavra →":"Ver o cenário completo ★"}</button>`
      :`<div class="tiles">${r.tiles.map((t,i)=>`<button class="tile ${t.first?"first":""} ${t.used?"used":""}" data-t="${i}" aria-label="letra ${t.ch}">${t.ch}</button>`).join("")}</div>
       <p class="hint">${P.level==="medio"?"A letra cor-de-rosa é a primeira.":P.level==="dificil"?"Atenção: há letras que não fazem parte da palavra.":"Toca nas letras para completar."}</p>
       <div class="actions"><button class="btn" id="clr">Apagar</button><button class="btn" id="hint" ${hintsLeft()?"":"disabled"} style="${hintsLeft()?"":"opacity:.45;cursor:default"}">${hintsLeft()?`Dica (${hintsLeft()})`:"Sem dicas"}</button></div>`}
  </div>`;
  c.querySelectorAll(".tile").forEach(b=>b.onclick=()=>place(+b.dataset.t));
  c.querySelectorAll(".slot").forEach(b=>b.onclick=()=>unplace(+b.dataset.s));
  $("hear").onclick=()=>say(it.w,true);
  if(r.done)$("next").onclick=next;else{$("clr").onclick=()=>{clearFree(r);r.state="";renderCard()};$("hint").onclick=hint}
}
function burst(cx,cy,n){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const cv=$("fx");if(!cv)return;
  const rc=cv.getBoundingClientRect(),ctx=cv.getContext("2d");cv.width=rc.width;cv.height=rc.height;
  const cols=["#ff7eb6","#ffc93c","#4aa3ff","#3cc47c","#9b6bff","#ff9f1c"];
  const Pt=Array.from({length:n},()=>({x:cx*rc.width,y:cy*rc.height,vx:(Math.random()-.5)*10,vy:-Math.random()*9-3,s:4+Math.random()*5,c:cols[Math.random()*6|0],a:Math.random()*6,va:(Math.random()-.5)*.3}));
  let f=0;(function tick(){ctx.clearRect(0,0,cv.width,cv.height);Pt.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.28;p.a+=p.va;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*1.6);ctx.restore()});
    if(++f<110)requestAnimationFrame(tick);else ctx.clearRect(0,0,cv.width,cv.height)})();
}
$("back").onclick=()=>{G=null;try{history.replaceState(null,"",location.pathname)}catch(e){}home()};
const h0=(location.hash||"").slice(1);if(h0&&ALL.some(s=>s.id===h0))play(h0);else home();
</script>

</body></html>
